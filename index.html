<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bitcoin Blake | Network Hashrate</title>
    <meta
        name="description"
        content="Bitcoin Blake network hashrate checker."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="header">
            <h1>Bitcoin Blake</h1>
        </header>

        <section class="hashrate">
            <p class="label">Network Hashrate</p>

            <div class="value">
                <span id="hashrate-value">--</span>
                <span id="hashrate-unit">PH/s</span>
            </div>

            <p class="updated">
                <span id="status">Loading...</span>
            </p>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
